name: flutter_delivery_box

description: "Smart Delivery Box IoT application using Flutter, ESP8266 and Firebase."

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10

  # State and storage (useful for IoT settings)
  shared_preferences: ^2.5.3
  google_fonts: ^8.2.1
  firebase_auth: ^5.7.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  fl_chart: ^0.69.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true